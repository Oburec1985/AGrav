<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>YVAC log</title>
  <style>
    body {
      width: 520px;
      margin: 0;
      font: 12px Arial, sans-serif;
      color: #1f1f1f;
      background: #fff;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    button {
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
      padding: 5px 8px;
      cursor: pointer;
    }

    #logs {
      max-height: 420px;
      overflow: auto;
      white-space: pre-wrap;
      padding: 10px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <header>
    <strong>YVAC Android</strong>
    <button id="copy">Скопировать лог</button>
    <button id="clear">Очистить</button>
  </header>
  <pre id="logs">Загрузка...</pre>
  <script src="popup.js"></script>
</body>
</html>
